{% extends "base.html" %}
{% block title %}Админка — Сервисы{% endblock %}

{% block content %}
  <section class="card">
    <h2>Добавить сервис</h2>
    {% if error %}<p class="status-pill status-unavailable">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/services/create" class="form-grid">
      <label>Название <input type="text" name="name" required></label>
      <label>Ссылка <input type="text" name="url" required></label>
      <label>Описание <input type="text" name="description"></label>
      <label>Приоритет <input type="number" name="sort_order" value="0"></label>
      <button type="submit">Создать</button>
    </form>
  </section>

  <section class="card" style="margin-top:1rem;">
    <h2>Список сервисов</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Имя</th><th>Ссылка</th><th>Описание</th><th>Статус</th><th>Приоритет</th><th>Действия</th></tr>
        </thead>
        <tbody>
        {% for service in services %}
          <tr>
            <form method="post" action="/admin/services/{{ service.id }}/edit">
              <td>{{ service.id }}</td>
              <td><input type="text" name="name" value="{{ service.name }}" required></td>
              <td><input type="text" name="url" value="{{ service.url }}" required></td>
              <td><input type="text" name="description" value="{{ service.description or '' }}"></td>
              <td><input type="checkbox" name="is_active" {% if service.is_active %}checked{% endif %}></td>
              <td><input type="number" name="sort_order" value="{{ service.sort_order or 0 }}"></td>
              <td class="row-actions">
                <button type="submit" class="btn-secondary">Изменить</button>
                  <button type="button" class="btn-danger" onclick="deleteService({{ service.id }})">
                  Удалить
                </button>
              </td>
            </form>
            <script>
            async function deleteService(serviceId) {

              const confirmed = confirm(
                "Удалить сервис?"
              );

              if (!confirmed) {
                return;
              }

              try {

                const response = await fetch(
                  `/admin/services/${serviceId}`,
                  {
                    method: "DELETE"
                  }
                );

                if (!response.ok) {
                  alert("Ошибка удаления");
                  return;
                }

                window.location.reload();

              } catch (error) {

                alert("Ошибка подключения");

              }
            }
            </script>
        {% endfor %}

        </tbody>
      </table>
    </div>
  </section>
{% endblock %}
