{% extends "base.html" %}
{% block title %}Вход в админку{% endblock %}

{% block content %}
  <section class="card" style="max-width:480px;">
    <h2>Вход в админку</h2>
    {% if error %}<p class="status-pill status-unavailable">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login" class="form-grid">
      <label>Логин
        <input type="text" name="username" required>
      </label>
      <label>Пароль
        <input type="password" name="password" required>
      </label>
      <button type="submit">Войти</button>
    </form>
  </section>
{% endblock %}
