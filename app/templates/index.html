{% extends "base.html" %}

{% block title %}MonAmogus — Проверка сервисов{% endblock %}

{% block header %}
  <p><strong>Ваш IP:</strong> {{ user_ip }}</p>

  <div class="dashboard-top">

    <!-- УПРАВЛЕНИЕ -->
    <div class="dashboard-actions card">
      <h2>Управление</h2>

      <div class="row-actions">
        <button id="refresh-services" type="button">
          Обновить список
        </button>

        <button id="bulk-check-services" type="button" class="btn-secondary">
          Проверить доступность
        </button>
      </div>
    </div>

  </div>
{% endblock %}

{% block content %}

  <!-- СПИСОК СЕРВИСОВ -->
  <section>
    <h2>Активные сервисы</h2>
    <ul id="service-cards" class="grid service-grid"></ul>
  </section>

  <!-- TOAST -->
  <div id="toast-wrap" class="toast-wrap" aria-live="polite"></div>

{% endblock %}

{% block scripts %}

  <!-- ПРОБРОС РОЛИ В JS -->
  <script>
    window.IS_ADMIN = {{ "true" if is_admin else "false" }};
  </script>

  <script src="/static/js/check.js"></script>

{% endblock %}
